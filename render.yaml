services:
  - type: web
    name: aea-command-center-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: JWT_SECRET                    # same value as JWT_SECRET on Vercel
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON   # same JSON as the ETL secret (for Refresh / live approvals)
        sync: false
      - key: ALLOWED_ORIGINS               # e.g. https://your-site.vercel.app
        sync: false
